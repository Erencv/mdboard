<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>MDBoard · Document</title>
<link rel="stylesheet" href="/static/pygments.css">
<script src="/static/mermaid.min.js"></script>
<style>
  :root{
    color-scheme:dark;
    --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --border:#30363d; --hl:#f2cc6055; --hl-strong:#f2cc60;
  }
  html{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);
    padding:12px 20px;display:flex;align-items:center;gap:16px;z-index:20;flex-wrap:wrap}
  header a.back{color:var(--accent);text-decoration:none;font-size:14px;white-space:nowrap}
  header .meta{color:var(--muted);font-size:13px}
  header h1{font-size:16px;margin:0;font-weight:600;min-width:0;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{display:flex;gap:24px;max-width:1200px;margin:0 auto;padding:24px 20px;align-items:flex-start}
  #content{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:28px 32px;overflow-wrap:break-word}
  aside{width:300px;flex-shrink:0;position:sticky;top:80px}
  aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  .note-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:10px;font-size:14px;cursor:pointer}
  .note-card:hover{border-color:var(--accent)}
  .note-card .quote{color:var(--hl-strong);font-style:italic;border-left:2px solid var(--hl-strong);
    padding-left:8px;margin-bottom:6px;font-size:13px}
  .note-card .body{color:var(--text)}
  .note-card .foot{color:var(--muted);font-size:12px;margin-top:8px;display:flex;justify-content:space-between}
  .note-card .del{color:#f85149;text-decoration:none;padding:6px 8px;margin:-6px -8px} /* larger tap target */
  .empty{color:var(--muted);font-size:14px}
  mark.hl{background:var(--hl);color:inherit;border-radius:2px;padding:1px 0;cursor:pointer}
  mark.hl.active{background:var(--hl-strong);color:#0d1117}
  /* rendered markdown */
  #content h1,#content h2{border-bottom:1px solid var(--border);padding-bottom:.3em}
  #content code{background:#0d1117;padding:.15em .4em;border-radius:4px;font-size:.9em}
  #content pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto}
  #content pre code{background:none;padding:0}
  #content blockquote{border-left:3px solid var(--border);margin:0;padding-left:16px;color:var(--muted)}
  #content table{border-collapse:collapse}#content th,#content td{border:1px solid var(--border);padding:6px 12px}
  #content a{color:var(--accent)}
  #content img{max-width:100%}
  /* mermaid chart frames */
  .chart-frame{position:relative;margin:22px 0;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;user-select:none;-webkit-user-select:none}
  .chart-toolbar{position:absolute;top:8px;right:8px;z-index:6;display:flex;gap:2px;align-items:center;
    padding:3px;background:rgba(13,17,23,.85);border:1px solid var(--border);border-radius:8px;
    opacity:.55;transition:opacity .15s}
  .chart-frame:hover .chart-toolbar,.chart-frame:focus-within .chart-toolbar{opacity:1}
  .chart-toolbar .zoom-pct{font-size:11px;color:var(--muted);min-width:36px;text-align:center;
    font-variant-numeric:tabular-nums;padding:0 2px}
  .chart-toolbar button{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;
    justify-content:center;background:transparent;color:var(--muted);border:1px solid transparent;font-size:13px}
  .chart-toolbar button:hover{color:var(--text);border-color:var(--border);background:#161b22}
  .chart-toolbar button:active{transform:scale(.92)}
  .chart-toolbar button svg{display:block}
  .chart-canvas{position:relative;overflow:hidden;padding:8px;min-height:60px;display:flex;
    justify-content:center;align-items:center;touch-action:pan-y}
  .chart-canvas.pannable{cursor:grab;touch-action:none}
  .chart-canvas.panning{cursor:grabbing}
  .chart-zoom{transform-origin:center center;will-change:transform}
  .chart-zoom svg{display:block}
  /* expanded: break out of the text column to (near) full viewport width */
  .chart-frame.expanded{width:min(92vw,1500px);left:50%;transform:translateX(-50%)}
  .chart-frame.is-fullscreen{display:flex;flex-direction:column;width:100vw;height:100vh;max-width:none;
    border:none;border-radius:0;background:var(--bg)}
  .chart-frame.is-fullscreen .chart-canvas{flex:1;min-height:0;padding:16px}
  .chart-frame.is-fullscreen .chart-toolbar{top:calc(12px + env(safe-area-inset-top,0px));right:12px;opacity:1}
  /* fixed-overlay fallback where the Fullscreen API is unavailable (iPhone Safari) */
  .chart-frame.is-pseudo-fullscreen{position:fixed;inset:0;z-index:1000;border:none;border-radius:0}
  body.chart-fs-lock{overflow:hidden}
  /* render failure */
  .chart-error-banner{padding:8px 14px;color:#f85149;font-size:13px;border-bottom:1px solid var(--border)}
  .chart-src{margin:0;padding:14px;overflow:auto;max-height:60vh;user-select:text;-webkit-user-select:text;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:var(--text)}
  /* selection popup */
  #popup{position:absolute;display:none;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:10px;box-shadow:0 8px 24px #0008;z-index:30;width:min(260px,calc(100vw - 16px))}
  #popup textarea{width:100%;height:60px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:8px;font-family:inherit;font-size:16px;resize:vertical;box-sizing:border-box}
  #popup .row{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
  button{font-family:inherit;font-size:13px;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid var(--border)}
  button.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent;color:var(--muted)}
  /* ---- mobile ---- */
  @media (max-width: 900px){
    .wrap{flex-direction:column;align-items:stretch;gap:16px;padding:16px 12px;max-width:640px}
    aside{width:auto;position:static;flex-shrink:0}
    #content{width:100%;padding:20px 16px}
    #content table{display:block;max-width:100%;overflow-x:auto}
    .chart-frame{margin:16px 0}
    .chart-frame.expanded{width:calc(100vw - 24px)}
  }
  @media (max-width: 480px){
    header{padding:10px 12px;gap:10px}
    .chart-toolbar button{width:24px;height:24px}
    .chart-toolbar .zoom-pct{display:none}
    #content{padding:16px 12px;border-radius:0;border-left:none;border-right:none}
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Board</a>
  <h1 id="title">Loading…</h1>
  <span class="meta" id="meta"></span>
</header>
<div class="wrap">
  <article id="content"></article>
  <aside>
    <h2>Notes &amp; highlights</h2>
    <div id="notes"><p class="empty">Select any text in the document to add a note.</p></div>
  </aside>
</div>

<div id="popup">
  <textarea id="popup-note" placeholder="Add a note (optional)…"></textarea>
  <div class="row">
    <button class="ghost" id="popup-cancel">Cancel</button>
    <button class="primary" id="popup-save">Highlight</button>
  </div>
</div>

<script>
const docId = parseInt(location.pathname.split("/").pop(), 10);
const content = document.getElementById("content");
const notesEl = document.getElementById("notes");
const popup = document.getElementById("popup");
let pending = null;   // {start,end,quote}
let notes = [];

const author = () => localStorage.getItem("mdboard_author") || "anonymous";

// ---- offset helpers: character offset within content's text ----
function textNodes(el){
  const out=[], w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n; while(n=w.nextNode()) out.push(n); return out;
}
// offset of a (node,offset) boundary, measured as text length before it
function boundaryOffset(node, offset){
  const r=document.createRange();
  r.selectNodeContents(content);
  r.setEnd(node, offset);
  return r.toString().length;
}
// wrap [start,end) of content's text in <mark> — safe across element boundaries.
// textContent length is unchanged by wrapping, so multiple highlights compose.
function wrapRange(start, end, id){
  const targets=[]; let pos=0;
  for(const node of textNodes(content)){
    const len=node.nodeValue.length, ns=pos, ne=pos+len;
    if(len>0 && ne>start && ns<end){
      targets.push({node, s:Math.max(start,ns)-ns, e:Math.min(end,ne)-ns});
    }
    pos+=len;
  }
  for(const t of targets){
    if(t.e>t.s){
      const r=document.createRange();
      r.setStart(t.node,t.s); r.setEnd(t.node,t.e);
      const m=document.createElement("mark");
      m.className="hl"; m.dataset.id=id;
      try{ r.surroundContents(m); }catch(e){/* skip ranges crossing element edges */}
    }
  }
}

async function load(){
  const r = await fetch(`/api/docs/${docId}`);
  if(!r.ok){ content.innerHTML = "<p class='empty'>Document not found.</p>"; document.getElementById("title").textContent="Not found"; return; }
  const doc = await r.json();
  document.getElementById("title").textContent = doc.title;
  document.getElementById("meta").textContent = `by ${doc.author} · ${doc.created_at}`;
  document.title = "MDBoard · " + doc.title;
  content.innerHTML = doc.html;
  await renderCharts();   // charts first: note anchors are offsets into the final DOM
  await loadNotes();
}

async function loadNotes(){
  notes = await (await fetch(`/api/docs/${docId}/notes`)).json();
  // re-render highlights: reload html-free? highlights are additive over current DOM.
  // Remove existing marks first by reloading content is overkill; instead apply on fresh content.
  notes.forEach(n => wrapRange(n.start_pos, n.end_pos, n.id));
  renderNotesList();
  bindMarks();
}

function renderNotesList(){
  if(!notes.length){ notesEl.innerHTML = "<p class='empty'>Select any text in the document to add a note.</p>"; return; }
  notesEl.innerHTML = "";
  notes.forEach(n => {
    const c = document.createElement("div");
    c.className = "note-card"; c.dataset.id = n.id;
    c.innerHTML = `<div class="quote">“${escapeHtml(n.quote)}”</div>
      ${n.note ? `<div class="body">${escapeHtml(n.note)}</div>` : ""}
      <div class="foot"><span>${escapeHtml(n.author)}</span><a class="del" href="#">delete</a></div>`;
    c.querySelector(".del").addEventListener("click", async (e)=>{
      e.preventDefault(); e.stopPropagation();
      await fetch(`/api/notes/${n.id}`, {method:"DELETE"});
      reload();
    });
    c.addEventListener("click", ()=> focusMark(n.id));
    notesEl.appendChild(c);
  });
}

function bindMarks(){
  document.querySelectorAll("mark.hl").forEach(m=>{
    m.addEventListener("click", ()=> focusMark(m.dataset.id));
  });
}
function focusMark(id){
  document.querySelectorAll("mark.hl.active").forEach(m=>m.classList.remove("active"));
  const m = document.querySelector(`mark.hl[data-id="${id}"]`);
  if(m){ m.classList.add("active"); m.scrollIntoView({behavior:"smooth", block:"center"}); }
  document.querySelectorAll(".note-card").forEach(c=>c.style.outline = c.dataset.id===String(id) ? "1px solid var(--accent)" : "none");
}

function reload(){ // simplest correct refresh: rebuild content + notes
  load();
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// ---- selection -> popup ----
// Desktop: shows on mouseup, as before. Touch: a long-press selection never
// fires a useful mouseup, so on coarse pointers we follow selectionchange.
const noteInput = document.getElementById("popup-note");
const coarsePointer = window.matchMedia("(hover: none)").matches;

function selectionInfo(){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  if(!content.contains(range.startContainer) || !content.contains(range.endContainer)) return null;
  const quote = sel.toString().trim();
  if(!quote) return null;
  const start = boundaryOffset(range.startContainer, range.startOffset);
  const end   = boundaryOffset(range.endContainer, range.endOffset);
  return {start:Math.min(start,end), end:Math.max(start,end), quote, rect:range.getBoundingClientRect()};
}

function updateSelectionPopup(opts){
  opts = opts || {};
  const info = selectionInfo();
  if(!info){ hidePopup(); return; }
  const visible = popup.style.display === "block";
  if(!opts.show && !visible) return; // fine pointers: only mouseup opens the popup
  pending = {start:info.start, end:info.end, quote:info.quote};
  const vw = document.documentElement.clientWidth;
  const pw = Math.min(260, vw - 16);
  let left = window.scrollX + info.rect.left;
  left = Math.max(window.scrollX + 8, Math.min(left, window.scrollX + vw - pw - 8));
  popup.style.width = pw + "px";
  popup.style.left = left + "px";
  popup.style.top  = (window.scrollY + info.rect.bottom + 8) + "px";
  popup.style.display = "block";
  if(opts.fresh || !visible) noteInput.value = "";
  if(opts.focus) noteInput.focus();
}

content.addEventListener("mouseup", (e)=>
  updateSelectionPopup({show:true, fresh:true, focus:e.isTrusted !== false}));

let _selT = null;
document.addEventListener("selectionchange", ()=>{
  // don't dismiss while the user is typing a note into the popup
  if(popup.style.display === "block" && popup.contains(document.activeElement)) return;
  clearTimeout(_selT);
  _selT = setTimeout(()=>
    updateSelectionPopup({show: coarsePointer || popup.style.display === "block"}), 120);
});

function hidePopup(){ popup.style.display="none"; pending=null; }
document.getElementById("popup-cancel").addEventListener("click", hidePopup);
document.getElementById("popup-save").addEventListener("click", async ()=>{
  if(!pending) return;
  const note = document.getElementById("popup-note").value.trim();
  await fetch(`/api/docs/${docId}/notes`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({quote:pending.quote, note, author:author(),
                          start_pos:pending.start, end_pos:pending.end})
  });
  window.getSelection().removeAllRanges();
  hidePopup();
  reload();
});
document.addEventListener("mousedown", (e)=>{ if(!popup.contains(e.target) && e.target.tagName!=="MARK") { /* keep until mouseup handles */ } });

// ===================== mermaid charts =====================
const _ic = (d) => '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICONS = {
  zoomIn:  _ic('<circle cx="7" cy="7" r="4.75"/><path d="M10.7 10.7 14 14M4.8 7h4.4M7 4.8v4.4"/>'),
  zoomOut: _ic('<circle cx="7" cy="7" r="4.75"/><path d="M10.7 10.7 14 14M4.8 7h4.4"/>'),
  reset:   _ic('<path d="M13.2 8A5.2 5.2 0 1 1 8 2.8c2 0 3.7 1.1 4.6 2.7"/><path d="M13 2.6v3h-3"/>'),
  expand:  _ic('<path d="M2.5 13.5 13.5 2.5M9 2.5h4.5V7M7 13.5H2.5V9"/>'),
  shrink:  _ic('<path d="M13.5 2.5 2.5 13.5M9 13.5h4.5V9M7 2.5H2.5V7"/>'),
  fullscreen:     _ic('<path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/>'),
  exitFullscreen: _ic('<path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5"/>'),
};

// one fullscreenchange dispatcher for all live chart frames
const chartFrames = new Set();
if (!window.__mdboardFsHook) {
  window.__mdboardFsHook = true;
  document.addEventListener("fullscreenchange", () => {
    for (const f of chartFrames) if (f._onFullscreenChange) f._onFullscreenChange();
  });
}

let chartSeq = 0;
let mermaidInitDone = false;

async function renderCharts(){
  // drop frames belonging to a previous load()
  for (const f of [...chartFrames]) {
    if (!f.isConnected) { if (f._ro) f._ro.disconnect(); chartFrames.delete(f); }
  }
  for (const el of content.querySelectorAll("div.mermaid")) {
    const src = el.textContent;
    let svg = null;
    if (window.mermaid) {
      if (!mermaidInitDone) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: "dark",
            securityLevel: "strict",
            fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
          });
          mermaidInitDone = true;
        } catch (e) { console.warn("mermaid.initialize failed:", e); }
      }
      if (mermaidInitDone) {
        try { svg = (await mermaid.render("mdboard-chart-" + (++chartSeq), src)).svg; }
        catch (err) { console.warn("mermaid render failed:", err); }
      }
    } else {
      console.warn("mermaid.min.js failed to load; showing chart sources as code");
    }
    el.replaceWith(svg ? makeChartFrame(svg) : makeChartError(src));
  }
}

function makeChartError(source){
  const frame = document.createElement("div");
  frame.className = "chart-frame";
  const banner = document.createElement("div");
  banner.className = "chart-error-banner";
  banner.textContent = "Chart could not be rendered \u2014 showing source instead.";
  const pre = document.createElement("pre");
  pre.className = "chart-src";
  pre.textContent = source;
  frame.append(banner, pre);
  return frame;
}

function makeChartFrame(svgStr){
  const frame = document.createElement("div");
  frame.className = "chart-frame";
  chartFrames.add(frame);

  const canvas = document.createElement("div");
  canvas.className = "chart-canvas";
  const zoomer = document.createElement("div");
  zoomer.className = "chart-zoom";
  zoomer.innerHTML = svgStr;
  canvas.appendChild(zoomer);
  frame.appendChild(canvas);

  // natural size from the viewBox; the svg itself is made fluid
  let natW = 800;
  const svg = zoomer.querySelector("svg");
  if (svg) {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    if (vb && vb.width > 0) natW = vb.width;
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    svg.style.width = "100%";
    svg.style.height = "auto";
    svg.style.maxWidth = "none";
  }

  // ---- zoom & pan state ----
  let s = 1, tx = 0, ty = 0;
  const overflows = () =>
    zoomer.offsetWidth * s > canvas.clientWidth + 2 ||
    zoomer.offsetHeight * s > canvas.clientHeight + 2;
  const clamp = () => {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const iw = zoomer.offsetWidth, ih = zoomer.offsetHeight;
    const mx = Math.max(0, (iw * s - cw) / 2) + 16;
    const my = Math.max(0, (ih * s - ch) / 2) + 16;
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  };
  const apply = () => {
    zoomer.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
    pct.textContent = Math.round(s * 100) + "%";
    canvas.classList.toggle("pannable", overflows());
  };
  const update = () => { clamp(); apply(); };

  const zoomAt = (factor, cx, cy) => {
    const ns = Math.min(6, Math.max(0.25, s * factor));
    if (ns === s) return;
    if (cx === undefined) { tx *= ns / s; ty *= ns / s; }
    else { tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); }
    s = ns;
    update();
  };
  const resetZoom = () => { s = 1; tx = 0; ty = 0; update(); };

  // ---- toolbar ----
  const toolbar = document.createElement("div");
  toolbar.className = "chart-toolbar";
  const pct = document.createElement("span");
  pct.className = "zoom-pct";
  pct.textContent = "100%";
  const addBtn = (icon, title, fn) => {
    const b = document.createElement("button");
    b.type = "button";
    b.title = title;
    b.setAttribute("aria-label", title);
    b.innerHTML = icon;
    b.addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); fn(); });
    toolbar.appendChild(b);
    return b;
  };
  addBtn(ICONS.zoomOut, "Zoom out", () => zoomAt(1 / 1.25));
  addBtn(ICONS.zoomIn, "Zoom in", () => zoomAt(1.25));
  toolbar.appendChild(pct);
  addBtn(ICONS.reset, "Reset zoom (or double-click the chart)", resetZoom);
  const expandBtn = addBtn(ICONS.expand, "Expand to full width", () => toggleExpand());
  const fsBtn = addBtn(ICONS.fullscreen, "Fullscreen", () => toggleFullscreen());
  frame.appendChild(toolbar);

  // ---- sizing: fit the chart to the canvas, capped at its natural width ----
  const fit = () => {
    const avail = Math.max(140, canvas.clientWidth - 16);
    zoomer.style.width = Math.min(natW, avail) + "px";
  };

  // ---- expand: break out of the text column ----
  const centerExpanded = () => {
    frame.style.marginLeft = "";
    if (!frame.classList.contains("expanded") || frame.classList.contains("is-fullscreen")) return;
    const r = frame.getBoundingClientRect();
    frame.style.marginLeft = ((window.innerWidth - r.width) / 2 - r.left) + "px";
  };
  function toggleExpand(){
    const on = frame.classList.toggle("expanded");
    expandBtn.innerHTML = on ? ICONS.shrink : ICONS.expand;
    expandBtn.title = on ? "Collapse back to column width" : "Expand to full width";
    expandBtn.setAttribute("aria-label", expandBtn.title);
    centerExpanded();
    update();
  }

  // ---- fullscreen ----
  // Native Fullscreen API where available; a fixed-overlay fallback where it
  // is not (iPhone Safari does not support element fullscreen).
  function syncFsUi(on){
    frame.classList.toggle("is-fullscreen", on);
    fsBtn.innerHTML = on ? ICONS.exitFullscreen : ICONS.fullscreen;
    fsBtn.title = on ? "Exit fullscreen (Esc)" : "Fullscreen";
    fsBtn.setAttribute("aria-label", fsBtn.title);
    expandBtn.style.display = on ? "none" : "";
    if (on) {
      // contain-fit so the whole chart is visible when going fullscreen
      const ch = canvas.clientHeight - 32, ih = zoomer.offsetHeight;
      s = Math.max(0.25, Math.min(1, ch / Math.max(1, ih)));
    } else {
      s = 1;
    }
    tx = 0; ty = 0;
    update();
  }
  frame._onFullscreenChange = () => syncFsUi(document.fullscreenElement === frame);

  const escHandler = (e) => {
    if (e.key === "Escape" && frame.classList.contains("is-pseudo-fullscreen")) exitPseudoFullscreen();
  };
  function enterPseudoFullscreen(){
    frame.classList.add("is-pseudo-fullscreen");
    document.body.classList.add("chart-fs-lock");
    document.addEventListener("keydown", escHandler);
    syncFsUi(true);
  }
  function exitPseudoFullscreen(){
    frame.classList.remove("is-pseudo-fullscreen");
    document.body.classList.remove("chart-fs-lock");
    document.removeEventListener("keydown", escHandler);
    syncFsUi(false);
  }
  function toggleFullscreen(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (frame.classList.contains("is-pseudo-fullscreen")) { exitPseudoFullscreen(); return; }
    if (typeof frame.requestFullscreen === "function") {
      const p = frame.requestFullscreen();
      if (p && p.catch) p.catch(() => enterPseudoFullscreen());
    } else {
      enterPseudoFullscreen();
    }
  }

  // ---- interactions ----
  // ctrl/cmd + wheel zooms (this is also the trackpad pinch gesture);
  // a plain wheel keeps scrolling the page
  canvas.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12,
           e.clientX - r.left - r.width / 2,
           e.clientY - r.top - r.height / 2);
  }, { passive: false });

  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !overflows()) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("panning");
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x);
    ty = drag.ty + (e.clientY - drag.y);
    update();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("panning"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("dblclick", (e) => { e.preventDefault(); resetZoom(); });

  // keep things sane when the canvas changes size (expand/fullscreen/window resize)
  const ro = new ResizeObserver(() => { fit(); centerExpanded(); update(); });
  ro.observe(canvas);
  frame._ro = ro;

  fit();
  update();
  return frame;
}

load();
</script>
</body>
</html>
