model: ollama_chat/coder
edit-format: whole
map-tokens: 600
auto-commits: true
gitignore: true
stream: true
yes-always: true
# pin context to the 8K the GTX 1060 holds fully in VRAM
set-env:
  - OLLAMA_API_BASE=http://127.0.0.1:11434
  - OLLAMA_CONTEXT_LENGTH=8192
# after each edit, run tests; on failure aider gets the output and retries
auto-test: true
test-cmd: .venv/bin/python -m pytest -q
